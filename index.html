<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1614" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>GymTracker</title>
<style>
:root{--bg:#EEF3F1;--card:#fff;--line:#D5E2DD;--tx:#14231F;--mu:#5B706A;--ac:#2E7D6B;--oa:#fff;--in:#F5F9F8;--ok:#E1F5EE}
@media(prefers-color-scheme:dark){:root{--bg:#0F1614;--card:#17211E;--line:#26332F;--tx:#E6EFEC;--mu:#8FA39B;--ac:#3A9A84;--oa:#08130F;--in:#0F1614;--ok:#14302A}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
header h1{font-size:18px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:12px 14px 80px;max-width:640px;margin:0 auto}
.btn{background:var(--ac);color:var(--oa);border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;min-height:44px}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn.s{min-height:36px;padding:4px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.card.hl{border-color:var(--ac);border-width:2px}
.card.last{border-left:4px solid var(--ac)}
.mu{color:var(--mu);font-size:13px}
.sec{color:var(--mu);font-weight:600;font-size:14px;margin:18px 0 8px}
.row{display:flex;gap:8px;align-items:center}
.col{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.bd{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
.b-amber{background:#FAEEDA;color:#633806}.b-teal{background:#E1F5EE;color:#085041}.b-green{background:#EAF3DE;color:#3B6D11}
.set{display:grid;grid-template-columns:24px 1fr 1fr 48px;gap:8px;align-items:center;margin-top:8px}
.set input{width:100%;height:46px;border-radius:8px;border:1px solid var(--line);background:var(--in);color:var(--tx);font:700 18px system-ui,sans-serif;font-variant-numeric:tabular-nums;text-align:center}
.set input::placeholder{color:var(--mu);font-weight:400}
.set input:focus{outline:2px solid var(--ac);outline-offset:1px}
.ck{height:46px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--mu);font-size:20px}
.set.ok input{border-color:var(--ac);background:var(--ok)}
.set.ok .ck{background:var(--ac);color:var(--oa);border-color:var(--ac)}
summary{cursor:pointer;color:var(--mu);font-size:13px;margin-top:10px}
details .mu{margin-top:6px;font-size:13.5px}
#t{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:9;max-width:90%}
.chart{position:relative;height:210px;margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px;margin-top:10px}
.kpi{background:var(--in);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
.kpi b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--mu)}
.delta{font-weight:700}
.up{color:#1B6B45}.down{color:#B3261E}
@media(prefers-color-scheme:dark){.up{color:#5CD6A0}.down{color:#FF8A80}}
.seg{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.btn.on{border-color:var(--ac);color:var(--ac)}
select#exsel{width:100%;min-height:44px;margin-top:8px;border-radius:8px;border:1px solid var(--line);background:var(--in);color:var(--tx);font:inherit;padding:0 10px}
.lst{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px;font-variant-numeric:tabular-nums}
.lst:last-child{border-bottom:0}
.lst span:last-child{color:var(--mu);text-align:right}
.ex-h{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header id="hd"></header>
<main id="app"></main>
<div id="t"></div>
<input type="file" id="f" hidden>
<script src="vendor/chart.umd.min.js" defer></script>
<script src="analytics.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
